<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Operations and maintenance portal for GAIL's Jamnagar–Loni LPG Pipeline">
<meta name="theme-color" content="#0A2E6E">
<title>JLPL (O&amp;M) | GAIL (India) Limited</title>



<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet"><style>
:root{
  --navy:#0A2E6E; --navy-2:#123F92; --navy-3:#1B56C4; --yellow:#F5B800; --yellow-2:#FFD34D; --red:#D7262E; --green:#1E8E5A; --amber:#DB8400; --sky:#4C8DFF;
  --bg:#EAEEF4; --surface:#FFFFFF; --surface-2:#F4F7FB; --line:#D5DCE7; --text:#14213A; --muted:#58677F; --link:#123F92;
  --hero-a:#061A40; --hero-b:#0E3A8A; --map-bg:#F3F0E4; --map-ink:#6F6650;
  --shadow:0 1px 2px rgba(10,46,110,.06),0 12px 32px -16px rgba(10,46,110,.28);
  --shadow-lg:0 30px 60px -24px rgba(6,26,64,.45);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08101E; --surface:#101B30; --surface-2:#16233D; --line:#23324F; --text:#E4EAF5; --muted:#93A1B9; --link:#8DB4FF;
    --hero-a:#030C20; --hero-b:#0A2860; --map-bg:#142038; --map-ink:#9AA7BD;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7); --shadow-lg:0 30px 60px -24px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#08101E; --surface:#101B30; --surface-2:#16233D; --line:#23324F; --text:#E4EAF5; --muted:#93A1B9; --link:#8DB4FF;
  --hero-a:#030C20; --hero-b:#0A2860; --map-bg:#142038; --map-ink:#9AA7BD;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7); --shadow-lg:0 30px 60px -24px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;min-height:100%;zoom:var(--zoom,1);background:var(--bg);color:var(--text);font:15px/1.55 'IBM Plex Sans','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:4px}
.hi{font-family:'Noto Sans Devanagari','IBM Plex Sans',sans-serif}
.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif}
.ic{flex-shrink:0;vertical-align:middle}
.wrap{max-width:1360px;margin:0 auto;padding:0 24px;width:100%}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- utility bar + ticker ---------- */
.util{background:var(--hero-a);color:#C8D5EE;font-size:13px}
.util .wrap{display:flex;align-items:center;gap:16px;min-height:36px}
.ticker{flex:1;min-width:0;overflow:hidden;position:relative;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker-track{display:inline-flex;gap:48px;white-space:nowrap;animation:tick 60s linear infinite;padding-left:100%}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-track span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--yellow);margin-right:10px;vertical-align:middle}
@keyframes tick{to{transform:translateX(-100%)}}
.util-actions{display:flex;gap:6px;align-items:center}
.util button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#E4ECFA;border-radius:6px;padding:3px 10px;display:inline-flex;gap:6px;align-items:center;font-size:12.5px}
.util button:hover{background:rgba(255,255,255,.14)}
.emerg{color:#FFD34D;font-weight:600;white-space:nowrap}
@media (max-width:700px){.emerg{display:none}}

/* ---------- header ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--yellow) 0 33%,var(--red) 33% 36%,var(--navy-2) 36%)}
.topbar .wrap{position:relative;display:flex;align-items:center;gap:18px;min-height:72px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);flex-shrink:0}
.mark{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--yellow-2),var(--yellow) 60%);display:grid;place-items:center;border:3px solid var(--red);box-shadow:0 4px 14px -4px rgba(215,38,46,.5)}
.mark span{font:700 14px/1 'Barlow Condensed',sans-serif;color:var(--navy);letter-spacing:.5px}
.brand b{display:block;font:700 22px/1.05 'Barlow Condensed',sans-serif;color:var(--link)}
.brand small{color:var(--muted);font-size:13px}
nav.main{margin-left:auto;display:flex;gap:2px;align-items:center}
nav.main>a,nav.main>.ddwrap>button{background:none;border:0;padding:9px 11px;border-radius:8px;color:var(--text);text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
nav.main>a:hover,nav.main>.ddwrap>button:hover{background:var(--surface-2);color:var(--link)}
nav.main .active{color:var(--link)!important;background:color-mix(in srgb,var(--yellow) 20%,transparent)!important}
.ddwrap{position:relative}
.mega{position:absolute;top:calc(100% + 10px);left:0;width:min(760px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:14px;display:none;grid-template-columns:repeat(3,1fr);gap:4px}
.mega.open{display:grid}
.mega a{display:flex;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--text)}
.mega a:hover{background:var(--surface-2)}
.mega a .mi{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--navy-2) 10%,transparent);color:var(--link)}
.mega a b{display:block;font-size:14px;font-weight:600}
.mega a small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.hdr-actions{display:flex;gap:8px;align-items:center}
.kbtn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px;color:var(--muted);font-size:13.5px;min-width:190px}
.kbtn kbd{margin-left:auto;font:600 11px 'IBM Plex Sans';border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--surface)}
.burger{display:none;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px}
@media (max-width:1600px) and (min-width:1181px){.topbar .wrap{flex-wrap:wrap;row-gap:0;padding-top:8px}nav.main{order:3;width:100%;margin-left:-11px;flex-wrap:wrap;padding-bottom:6px}.hdr-actions{margin-left:auto}}
@media (max-width:1180px){
  .burger{display:inline-flex}
  nav.main{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);flex-direction:column;align-items:stretch;padding:12px 24px 20px;border-bottom:1px solid var(--line);max-height:78vh;overflow:auto;box-shadow:var(--shadow-lg)}
  nav.main.open{display:flex}
  .mega{position:static;transform:none;width:100%;box-shadow:none;border:0;padding:0;grid-template-columns:1fr 1fr}
  .hdr-actions{margin-left:auto}
}
@media (max-width:560px){.mega{grid-template-columns:1fr}.brand small{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;color:#fff;background:linear-gradient(180deg,var(--hero-a),var(--hero-b));overflow:hidden;isolation:isolate}
.hero-scene{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .wrap{padding-top:54px;padding-bottom:150px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}
@media (max-width:960px){.hero .wrap{grid-template-columns:1fr;padding-bottom:130px}}
.greet{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:40px;padding:6px 14px 6px 8px;font-size:13.5px;backdrop-filter:blur(6px)}
.greet .live{width:8px;height:8px;border-radius:50%;background:#3BE38A;box-shadow:0 0 0 0 rgba(59,227,138,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(59,227,138,0)}100%{box-shadow:0 0 0 0 rgba(59,227,138,0)}}
.hero h1{font:700 clamp(40px,6vw,76px)/.95 'Barlow Condensed',sans-serif;margin:18px 0 14px;letter-spacing:-.5px}
.hero h1 span{display:block;color:#AFC6F0;font-weight:600;font-size:.52em;letter-spacing:0;margin-top:10px}
.hero p.lead{margin:0;max-width:56ch;color:#D1DDF3;font-size:16px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;background:var(--navy-2);color:#fff;font-weight:600;text-decoration:none;font-size:14px;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.y{background:var(--yellow);color:#1A1A1A}
.btn.glass{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff}
.btn.ghost{background:transparent;color:var(--link);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.red{background:var(--red)}
.linkbtn{background:none;border:0;color:var(--link);font-weight:600;padding:4px;display:inline-flex;gap:6px;align-items:center;text-decoration:none;font-size:14px}
.hero-side{display:grid;gap:14px}
.glass{background:rgba(10,30,70,.45);border:1px solid rgba(255,255,255,.16);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.clockcard{padding:20px 22px;display:flex;justify-content:space-between;gap:16px;align-items:center}
.clockcard .t{font:700 46px/1 'Barlow Condensed';font-variant-numeric:tabular-nums}
.clockcard .d{color:#C5D3EE;font-size:14px;margin-top:4px}
.safecard{padding:20px 22px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.safecard .big{font:700 64px/.9 'Barlow Condensed';color:var(--yellow);font-variant-numeric:tabular-nums}
.safecard b{display:block;font-size:15px}
.safecard small{color:#C5D3EE;font-size:13px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{padding:14px;text-align:left}
.mini .v{font:700 26px/1 'Barlow Condensed'}
.mini .l{font-size:12px;color:#C5D3EE;margin-top:4px}

/* route strip card */
.routecard{position:relative;margin-top:-110px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:18px 22px 14px}
.routecard-h{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.routecard-h h2{margin:0;font:700 24px 'Barlow Condensed'}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:2px solid var(--navy)}
.strip-scroll{overflow-x:auto;margin-top:6px}
.strip{min-width:980px;width:100%;display:block}
.strip text{fill:var(--text);font:600 12.5px 'IBM Plex Sans',sans-serif}
.strip .sub{fill:var(--muted);font-weight:400;font-size:11px}
.strip a{cursor:pointer}
.strip a:hover .ring,.strip a:focus .ring{opacity:1}
.strip .ring{opacity:0;transition:opacity .2s}
.flow{stroke-dasharray:2 16;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}

/* ---------- sections ---------- */
main{flex:1}
.section{padding:34px 0}
.sec-h{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.sec-h h2{margin:0;font:700 32px/1 'Barlow Condensed'}
.sec-h p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.badge.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#1FBF6A;animation:pulse 2s infinite}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}

@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .ki{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;margin-bottom:12px}
.kpi .v{font:700 36px/1 'Barlow Condensed';font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;font-weight:600;margin-left:3px;color:var(--muted)}
.kpi .l{font-weight:600;font-size:13.5px;margin-top:6px}
.kpi .d{color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}
.kpi .bar{height:4px;border-radius:4px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:4px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.panel-h h3{margin:0;font-size:16px;font-weight:600;display:flex;gap:10px;align-items:center}
.panel-h h3 .ic{color:var(--link)}
.panel-b{padding:16px 20px}

/* pulse (live ops) */
.pulse-grid{display:grid;grid-template-columns:340px 1fr;gap:18px}
@media (max-width:1060px){.pulse-grid{grid-template-columns:1fr}}
.through{background:linear-gradient(160deg,var(--navy),var(--navy-3));color:#fff;border:0;padding:22px;display:flex;flex-direction:column;gap:14px}
.through .lbl{color:#C5D3EE;font-size:13.5px}
.through .num{font:700 58px/1 'Barlow Condensed';font-variant-numeric:tabular-nums}
.through .num small{font-size:20px;color:#C5D3EE;margin-left:4px}
.through .row{display:flex;justify-content:space-between;font-size:13.5px;border-top:1px solid rgba(255,255,255,.15);padding-top:10px}
.gauges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 10px;text-decoration:none;color:var(--text);display:block;transition:border-color .15s}
.gcard:hover{border-color:var(--navy-3)}
.gcard .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.gcard .top b{font-size:14px}
.gcard svg{display:block;margin:4px auto 0}
.gcard .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.pumps{display:flex;gap:3px}
.pumps i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.pumps i.on{background:#1FBF6A}
.deliv{display:grid;gap:10px}
.dl{display:grid;grid-template-columns:110px 1fr 70px;gap:12px;align-items:center;font-size:13.5px}
.dl .track{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.dl .track i{display:block;height:100%;background:linear-gradient(90deg,var(--navy-3),var(--sky));border-radius:6px;transition:width .8s}
.dl .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* events + calendar */
.ev-grid{display:grid;grid-template-columns:420px 1fr;gap:18px;align-items:start}
@media (max-width:1060px){.ev-grid{grid-template-columns:1fr}}
.cal{padding:14px 18px 6px}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cal-h b{font-size:14.5px}
.cal-h button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;width:30px;height:30px;display:grid;place-items:center}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12.5px}
.cal-g .dn{color:var(--muted);font-size:11.5px;padding:4px 0}
.cal-g button{border:0;background:none;border-radius:8px;height:34px;position:relative;font-variant-numeric:tabular-nums}
.cal-g button:hover{background:var(--surface-2)}
.cal-g button.today{outline:2px solid var(--yellow);outline-offset:-2px;font-weight:700}
.cal-g button.has::after{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--red)}
.cal-g button.sel{background:var(--navy-2);color:#fff}
.cal-g .out{opacity:.35}
.evs{max-height:470px;overflow:auto}
.ev{display:grid;grid-template-columns:58px 1fr;gap:14px;padding:14px 20px;border-top:1px solid var(--line)}
.ev .date{background:color-mix(in srgb,var(--red) 11%,var(--surface));color:var(--red);border-radius:12px;text-align:center;padding:8px 2px;align-self:start}
.ev .date b{display:block;font:700 26px/1 'Barlow Condensed'}
.ev .date span{font-size:11px;font-weight:600}
.ev h4{margin:0 0 2px;font-size:14.5px;line-height:1.4}
.ev p{margin:0;color:var(--muted);font-size:13.5px}
.ev .meta{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--text)}
.tag.HR{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.tag.FS{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,transparent)}
.tag.OM{color:var(--link)}

/* map */
.map-scroll{overflow-x:auto}
.map{display:block;min-width:640px;width:100%;background:var(--map-bg);border-radius:12px}
.map text{font-family:'IBM Plex Sans',sans-serif}
.map .st{font-size:11px;font-weight:600;fill:var(--text);paint-order:stroke;stroke:var(--map-bg);stroke-width:3px}
.map .state{font:600 20px 'Barlow Condensed',sans-serif;fill:var(--map-ink);opacity:.45;letter-spacing:3px}
.map a:hover circle.m,.map a:focus circle.m{stroke:var(--yellow);stroke-width:3.5}
.maptip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;box-shadow:var(--shadow-lg);display:none;z-index:4;max-width:220px}
.map-layers{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 12px;font-size:12.5px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--navy-2);color:#fff;border-color:var(--navy-2)}

/* analytics */
.an-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.an-grid .wide{grid-column:1/-1}
@media (max-width:980px){.an-grid{grid-template-columns:1fr}}
.chartbox{position:relative;height:290px}
.chartbox.sm{height:250px}

/* safety + links */
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
@media (max-width:1060px){.three{grid-template-columns:1fr}}
.safety-board{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:0 0 16px 16px;overflow:hidden}
.safety-board div{background:var(--surface);padding:16px 18px}
.safety-board .v{font:700 32px/1 'Barlow Condensed';font-variant-numeric:tabular-nums}
.safety-board .l{font-size:12.5px;color:var(--muted);margin-top:4px}
.qlinks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qlinks a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:12px;border:1px solid var(--line);text-decoration:none;color:var(--text);font-size:12.5px;font-weight:500;text-align:center;background:var(--surface-2)}
.qlinks a:hover{border-color:var(--navy-3);color:var(--link)}
.qlinks .qi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff}
.list{margin:0;padding:0;list-style:none}
.list li{padding:12px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}

.entry-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 20px}
@media (max-width:700px){.entry-grid{grid-template-columns:1fr}}
.entry{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-decoration:none;color:var(--text)}

.entry .ei{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--yellow) 25%,transparent);color:#8A6400;flex-shrink:0}
.entry b{display:block}.entry small{color:var(--muted);font-size:12.5px}
.entry .ep{margin-left:auto;text-align:right}.entry .ep .cond{display:block;white-space:nowrap;font-size:26px;font-weight:700;line-height:1}.entry .ep small{font-size:11px}
.omc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 20px}
@media (max-width:700px){.omc-grid{grid-template-columns:1fr}}
.omc{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:12px 14px}
.omc-h{display:flex;justify-content:space-between;align-items:baseline}.omc-h .cond{font-size:30px;font-weight:700;line-height:1}
.omc-l{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.omc-l a{display:inline-flex;gap:4px;align-items:center;font-size:13px;padding:3px 10px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);text-decoration:none}
.omc-l a:hover{border-color:var(--navy-3);color:var(--link)}
.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:1060px){.proj-grid{grid-template-columns:1fr}}
.proj{padding:20px;display:flex;flex-direction:column;gap:14px}
.proj-h h3{margin:8px 0 0;font-size:17px}
.proj-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.proj-stats div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.proj-stats .cond{display:block;font-size:24px;font-weight:700;line-height:1.05}.proj-stats small{color:var(--muted);font-size:12px;line-height:1.3;display:block;margin-top:4px}
.netbars{display:grid;gap:10px}
.prop-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:600px){.prop-grid{grid-template-columns:1fr}}
.prop{display:flex;gap:12px;align-items:flex-start}
.prop .pi2{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.prop b{display:block;font-size:14.5px}.prop small{color:var(--muted);font-size:13px;line-height:1.45;display:block}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;column-gap:12px}
.steps li::before{content:counter(s);grid-row:span 2;width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font:700 16px 'Barlow Condensed'}
.steps b{font-size:14.5px}.steps span{color:var(--muted);font-size:13.5px}
.chklist label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.chklist label:first-child{border-top:0}
.chklist input{width:18px;height:18px;margin-top:2px;accent-color:var(--green)}
.chklist input:checked+span{color:var(--muted);text-decoration:line-through}
/* page banner */
.pbanner{background:linear-gradient(120deg,var(--hero-a),var(--hero-b));color:#fff;position:relative;overflow:hidden}
.pbanner .wrap{padding-top:34px;padding-bottom:34px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pbanner .pi{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;color:var(--yellow)}
.pbanner h1{margin:0;font:700 clamp(32px,4vw,46px)/1 'Barlow Condensed'}
.pbanner p{margin:6px 0 0;color:#C9D6EE;max-width:70ch}
.crumbs{font-size:12.5px;color:#9FB4DB;margin-bottom:6px}
.crumbs a{color:#C9D6EE;text-decoration:none}
.pbanner svg.bgp{position:absolute;right:-40px;top:-30px;opacity:.12;z-index:0}
.pbanner .wrap>*{position:relative;z-index:1}
.page{padding:28px 0 56px}

/* explorer */
.explorer{display:grid;grid-template-columns:320px 1fr;min-height:620px;overflow:hidden}
@media (max-width:900px){.explorer{grid-template-columns:1fr}}
.ex-side{border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--surface-2)}
.ex-side .srch{padding:14px 16px;border-bottom:1px solid var(--line)}
.inp{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.ex-list{overflow:auto;max-height:640px;padding-bottom:10px}
.ex-group{padding:14px 20px 4px;font-size:12px;color:var(--muted);font-weight:600}
.ex-list a{display:flex;gap:10px;align-items:center;padding:10px 20px;text-decoration:none;color:var(--text);font-weight:500;font-size:14.5px;border-left:3px solid transparent}
.ex-list a:hover{background:var(--surface)}
.ex-list a.sel{background:var(--surface);border-left-color:var(--yellow);color:var(--link)}
.ex-list a .ty{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.ex-main{padding:26px 30px;min-width:0}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px}
.st-head{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-start}
.st-head h2{font:700 50px/1 'Barlow Condensed';margin:8px 0 0}
.typebadge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--link);border-bottom-color:var(--yellow)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.fact{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fact .k{font-size:12px;color:var(--muted)}
.fact .v{font-weight:600;font-size:15px}
.fact .v.big{font:700 28px/1.1 'Barlow Condensed';font-variant-numeric:tabular-nums}
.health{display:flex;align-items:center;gap:10px}
.health .track{flex:1;height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line);min-width:80px}
.health .track i{display:block;height:100%}

/* tables */
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--surface-2);color:var(--muted);text-align:left;font-weight:600;font-size:12.5px;padding:11px 14px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-top:1px solid var(--line);white-space:nowrap}
tbody tr:first-child td{border-top:0}

.pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:20px;display:inline-block}
.p-ok{color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)}
.p-warn{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.p-bad{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.p-mute{color:var(--muted);background:var(--surface-2)}

/* contracts */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

.tile{border:0;border-radius:18px;padding:22px;color:#fff;text-align:left;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08)}
.tile b{display:block;font-size:18px}
.tile span{font-size:13px;opacity:.88}
.tile .ti{width:48px;height:48px;border-radius:13px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.t1{background:linear-gradient(135deg,#123F92,#1B56C4)}.t2{background:linear-gradient(135deg,#136B42,#1E9A60)}.t3{background:linear-gradient(135deg,#A45B00,#DB8400)}
.dash{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-top:20px}
@media (max-width:980px){.dash{grid-template-columns:1fr}}
.alerts{display:grid;gap:12px}
.alert{display:flex;align-items:center;gap:16px;padding:16px 20px}
.alert .ai{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.alert .n{font:700 40px/1 'Barlow Condensed';margin-left:auto}
.alert .t{font-weight:600}
.alert .s{color:var(--muted);font-size:13px}

/* misc pages */
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:900px){.cols2{grid-template-columns:1fr}}
.note{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--yellow) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--yellow) 45%,transparent);border-radius:12px;padding:11px 14px;font-size:13.5px;margin-bottom:18px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar .inp{max-width:340px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pcard{padding:18px;display:flex;flex-direction:column;gap:10px}

.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--navy-3);flex-shrink:0}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative;margin-bottom:14px}
.tl::before{content:"";position:absolute;left:-23px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--yellow);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--yellow)}
.org{display:flex;flex-direction:column;align-items:center}
.org .node{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;text-align:center;box-shadow:var(--shadow);min-width:230px}
.org .node b{display:block}
.org .node span{font-size:13px;color:var(--muted)}
.org .top{border-top:4px solid var(--yellow)}
.org .vline{width:2px;height:26px;background:var(--line)}
.org .fn{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:900px}
.org .row{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:100%;border-top:2px solid var(--line);padding-top:26px}
@media (max-width:820px){.org .row{grid-template-columns:1fr}}
.org .zone .node{width:100%}
.org .zone ul{list-style:none;padding:10px 0 0;margin:0;display:grid;gap:6px}
.org .zone li a{display:flex;justify-content:space-between;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--text);font-size:14px}

/* dialogs */
dialog{border:0;border-radius:18px;padding:0;width:min(540px,94vw);background:var(--surface);color:var(--text);box-shadow:0 40px 80px -20px rgba(0,0,0,.55)}
dialog::backdrop{background:rgba(4,14,34,.6);backdrop-filter:blur(3px)}
.form{padding:22px 24px;display:grid;gap:12px}
.form h2{margin:0 0 4px;font:700 26px 'Barlow Condensed'}
.form label{display:grid;gap:4px;font-size:13.5px;font-weight:600}
.form input,.form select,.form textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-weight:400}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.err{color:var(--red);font-size:13px;min-height:18px}
#cmd{width:min(640px,94vw);margin-top:12vh}
.cmd-in{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.cmd-in input{flex:1;border:0;background:none;font-size:16px;outline:none}
.cmd-res{max-height:52vh;overflow:auto;padding:8px}
.cmd-res a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--text)}
.cmd-res a.on{background:var(--surface-2);color:var(--link)}
.cmd-res small{margin-left:auto;color:var(--muted);font-size:12px}
.cmd-foot{padding:8px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.toast{visibility:hidden;position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;transition:transform .25s;z-index:200;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow-lg)}
.toast.show{visibility:visible;transform:translateX(-50%) translateY(0)}

/* footer */
footer{background:var(--hero-a);color:#B8C7E4;font-size:14px;margin-top:20px}
footer .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px;padding-top:40px;padding-bottom:30px}
@media (max-width:860px){footer .wrap{grid-template-columns:1fr 1fr}}
footer h4{color:#fff;margin:0 0 12px;font-size:15px}

footer a:hover{color:var(--yellow)}
.foot-b{border-top:1px solid rgba(255,255,255,.1);text-align:center;padding:16px;font-size:13px;color:#8FA3C8}
.sos{display:grid;gap:8px}

.sos b{color:var(--yellow);font-family:'Barlow Condensed';font-size:20px;line-height:1}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.ticker-track{padding-left:0;flex-wrap:wrap;white-space:normal}}
@media print{.util,.topbar,footer,.noprint,.pbanner{display:none!important}body{background:#fff}.panel{box-shadow:none}}

.skip:focus{top:12px}
.fsz{display:inline-flex;border:1px solid rgba(255,255,255,.14);border-radius:6px;overflow:hidden}

.userbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:5px 10px 5px 5px;font-size:13.5px}
.userbtn .avatar{width:30px;height:30px;font-size:12px}
.userbtn small{display:block;color:var(--muted);font-size:11.5px;line-height:1.1}
.usermenu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);min-width:240px;padding:8px;display:none;z-index:70}

.rolepill{font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;background:color-mix(in srgb,var(--navy-3) 14%,transparent);color:var(--link)}
.login{min-height:calc(100vh - 36px);display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg)}
@media (max-width:900px){.login{grid-template-columns:1fr}.login .side{display:none}}

.mega.sm{width:min(460px,92vw);grid-template-columns:1fr 1fr}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .v{font:700 30px/1 'Barlow Condensed';font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:4px}
.mod-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}

.mod-tools .sp{flex:1}
td.clip{max-width:320px;overflow:hidden;text-overflow:ellipsis}
tr.click{cursor:pointer}
.dl-grid{display:grid;grid-template-columns:170px 1fr;gap:8px 16px;font-size:14px;padding:4px 0 8px}

.form .full{grid-column:1/-1}
.form .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.form .grid2,.form .row2{grid-template-columns:1fr}}
dialog.wide{width:min(760px,95vw)}
.formscroll{max-height:62vh;overflow:auto;display:grid;gap:12px;padding-right:4px}
.filechip{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2);color:var(--link);text-decoration:none}
.qty{display:inline-flex;align-items:center;gap:6px}

.entry-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}

/* pipeline mimic animation */
.mimic{display:block;min-width:1100px;width:100%;height:auto;border-radius:12px}
.mimic-wrap{background:#0C1426;border-radius:14px;box-shadow:0 20px 50px -24px rgba(5,10,25,.7)}
.mflow{stroke-dasharray:2 16;animation:mflow 1s linear infinite;opacity:.95}
@keyframes mflow{to{stroke-dashoffset:-36}}
.msweep{stroke-dasharray:140 1300;animation:msweep 4.5s cubic-bezier(.45,0,.55,1) infinite}
@keyframes msweep{from{stroke-dashoffset:140}to{stroke-dashoffset:-1300}}
.mring{transform-box:fill-box;transform-origin:center;animation:mring 2.8s ease-out infinite}
@keyframes mring{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.35);opacity:0}}
.imp{transform-box:fill-box;transform-origin:center;animation:mspin 1.2s linear infinite}
@keyframes mspin{to{transform:rotate(360deg)}}
.mblink{animation:mblink 1.6s ease-in-out infinite}
@keyframes mblink{50%{opacity:.25}}
.mlink{cursor:pointer}
.mlink:hover rect,.mlink:focus rect{stroke:#FFC93C;stroke-width:1.5}
</style>

const Store={
  mode:'local', user:null, perms:null, authMode:'local', settings:{},
  async init(){
    try{const r=await fetch('api/health',{cache:'no-store'});const j=await r.json();if(j&&j.app==='jlpl'){this.mode='api';this.authMode=j.authMode;}}catch(e){}
    if(this.mode==='api'){const r=await this.req('GET','api/me').catch(()=>null);if(r&&r.user){this.user=r.user;this.perms=r.perms;}}
    else{const u=lsGet('jlpl.demoUser',null);if(u){this.user=u;this.perms=demoPerms(u);}seedDemo();}
    if(this.user) await this.loadSettings();
  },
  async req(method,url,body){
    const r=await fetch(url,{method,headers:{'Content-Type':'application/json','X-Requested-With':'jlpl'},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
    let j={};try{j=await r.json();}catch(e){}
    if(r.status===401&&this.user){this.user=null;location.hash='#/login';}
    if(!r.ok) throw Object.assign(new Error(j.error||('Request failed ('+r.status+')')),{status:r.status});
    return j;
  },
  can(col,op,rec){const p=this.perms?.[col];if(!p) return false;if(p[op]) return true;
    return !!(rec&&p.own&&p.own[op]&&this.user&&rec._by===this.user.id);},
  canSet(k){return !!this.perms?._settings?.[k];},
  async list(col,params={}){
    if(!this.can(col,'r')) return [];
    if(this.mode==='api'){const q=new URLSearchParams(params).toString();return this.req('GET',`api/c/${col}${q?'?'+q:''}`).catch(e=>{if(e.status===403) return [];throw e;});}
    const db=lsGet('jlpl.demo',{c:{}});let a=(db.c[col]||[]).slice().reverse();if(params.station) a=a.filter(r=>r.station===params.station);return a;
  },
  async create(col,data){
    if(this.mode==='api'){
      try{return await this.req('POST',`api/c/${col}`,data);}
      catch(e){if(e instanceof TypeError||e.status===503){outboxAdd(col,data);toast('You are offline. Saved on this device and will send when back online.');return {...data,id:'pending'};}throw e;}
    }
    const db=lsGet('jlpl.demo',{c:{},seq:1});db.seq=(db.seq||1)+1;const rec={...data,id:db.seq,_by:this.user.id,_byName:this.user.name,_at:new Date().toISOString()};
    (db.c[col]=db.c[col]||[]).push(rec);lsSet('jlpl.demo',db);return rec;
  },
  async update(col,id,data){
    if(this.mode==='api') return this.req('PUT',`api/c/${col}/${id}`,stripMeta(data));
    const db=lsGet('jlpl.demo',{c:{}});const a=db.c[col]||[];const i=a.findIndex(r=>r.id===id);if(i<0) throw new Error('Not found');
    a[i]={...a[i],...stripMeta(data),_upd:new Date().toISOString()};lsSet('jlpl.demo',db);return a[i];
  },
  async remove(col,id){
    if(this.mode==='api') return this.req('DELETE',`api/c/${col}/${id}`);
    const db=lsGet('jlpl.demo',{c:{}});db.c[col]=(db.c[col]||[]).filter(r=>r.id!==id);lsSet('jlpl.demo',db);
  },
  async loadSettings(){
    this.settings=this.mode==='api'?await this.req('GET','api/settings').catch(()=>({})):lsGet('jlpl.demoSettings',{});
  },
  async setSetting(k,v){
    if(this.mode==='api') await this.req('PUT','api/settings/'+k,{value:v});
    else{const s=lsGet('jlpl.demoSettings',{});s[k]=v;lsSet('jlpl.demoSettings',s);}
    this.settings[k]=v;
  },
  async upload(file){
    if(this.mode!=='api') return {id:null,name:file.name,type:file.type,size:file.size,demo:true};
    const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('Could not read the file'));r.readAsDataURL(file);});
    return this.req('POST','api/files',{name:file.name,type:file.type,data});
  },
  fileUrl(f){return f&&f.id?'api/files/'+f.id:null;}
};
const stripMeta=d=>Object.fromEntries(Object.entries(d).filter(([k])=>!k.startsWith('_')&&k!=='id'));
function demoPerms(u){const ok=(rule)=>u.role==='admin'||rule===ALL||(Array.isArray(rule)&&rule.includes(u.role));const out={};
  for(const [c,p] of Object.entries(DEMO_PERMS)) out[c]={r:ok(p.r),c:ok(p.c),u:ok(p.u),d:ok(p.d),own:{u:Array.isArray(p.u)&&p.u.includes('owner'),d:Array.isArray(p.d)&&p.d.includes('owner')}};
  out._settings=Object.fromEntries(Object.entries(DEMO_SETTINGS_PERMS).map(([k,r])=>[k,ok(r)]));return out;}
function outboxAdd(col,data){const o=lsGet('jlpl.outbox',[]);o.push({col,data});lsSet('jlpl.outbox',o);}
async function outboxFlush(){const o=lsGet('jlpl.outbox',[]);if(!o.length||Store.mode!=='api'||!navigator.onLine) return;const left=[];
  for(const it of o){try{await Store.req('POST',`api/c/${it.col}`,it.data);}catch(e){if(e instanceof TypeError) left.push(it);}}
  lsSet('jlpl.outbox',left);if(o.length>left.length) toast(`${o.length-left.length} offline record(s) sent`);}

const fieldOf=(m,k)=>m.fields.find(f=>f.k===k)||(m.virtual&&m.virtual[k]&&{k,l:m.virtual[k].l,t:'date',virtual:1});

function cellVal(m,f,r,plain){
  const v=f.virtual?m.virtual[f.k].v(r):r[f.k];
  if(v==null||v==='') return plain?'':'<span class="muted">—</span>';
  if(f.t==='date') return plain?v:fmtDate(v);
  if(f.t==='datetime') return plain?v:fmtDT(v);
  if(f.t==='station') return plain?stName(v):esc(stName(v));
  if(f.t==='file') {if(plain) return v.name||'';const u=Store.fileUrl(v);return u?`<a class="filechip" href="${u}" target="_blank" rel="noopener">${ic('file',14)}${esc(v.name)}</a>`:`<span class="filechip">${ic('file',14)}${esc(v.name)}</span>`;}
  if(f.t==='gps') {if(plain) return v;return `<a class="filechip" href="https://www.google.com/maps?q=${encodeURIComponent(v)}" target="_blank" rel="noopener">${ic('pin',14)}${esc(v)}</a>`;}
  if(plain) return String(v);
  if(f.k==='phone'||f.k==='mobile') return `<a href="tel:${esc(v)}">${esc(v)}</a>`;
  if(f.k==='email') return `<a href="mailto:${esc(v)}">${esc(v)}</a>`;
  if(f.k==='link'){const u=safeUrl(v);return u?`<a href="${esc(u)}" target="_blank" rel="noopener">Open</a>`:esc(v);}
  return esc(v);
}
function fieldInput(f,val){
  const id='f_'+f.k, req=f.req?'required':'', v=val??(typeof f.def==='function'?f.def():f.def??'');
  const lab=`<label class="${f.full||f.t==='textarea'?'full':''}" for="${id}">${esc(t(f.l))}${f.req?' *':''}`;
  const hint=f.hint?`<small class="muted" style="font-weight:400">${esc(f.hint)}</small>`:'';
  if(f.t==='textarea') return `${lab}<textarea id="${id}" name="${f.k}" rows="3" ${req}>${esc(v)}</textarea>${hint}</label>`;
  if(f.t==='select') return `${lab}<select id="${id}" name="${f.k}" ${req}>${f.req?'':'<option value=""></option>'}${opts(f).map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>${hint}</label>`;
  if(f.t==='station'){const dv=v||(Store.user?.station||'');return `${lab}<select id="${id}" name="${f.k}" ${req}>${f.req?'':'<option value=""></option>'}${DATA.stations.map(s=>`<option value="${s.id}" ${s.id===dv?'selected':''}>${esc(s.name)}</option>`).join('')}</select>${hint}</label>`;}
  if(f.t==='file') return `${lab}<input id="${id}" type="file" data-file="${f.k}" accept=".pdf,.jpg,.jpeg,.png,.webp,.txt,.csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx">${v&&v.name?`<small class="muted" style="font-weight:400">Current: ${esc(v.name)}. Choose a file only to replace it.</small>`:''}${Store.mode!=='api'?'<small class="muted" style="font-weight:400">In demo mode only the file name is kept.</small>':''}</label>`;
  if(f.t==='gps') return `${lab}<span style="display:flex;gap:8px"><input id="${id}" name="${f.k}" value="${esc(v)}" placeholder="Latitude, longitude" style="flex:1"><button type="button" class="btn sm ghost" data-gps="${id}">${ic('crosshair',14)}Locate</button></span></label>`;
  const type=f.t==='datetime'?'datetime-local':f.t==='number'?'number':f.t==='date'?'date':'text';
  return `${lab}<input id="${id}" name="${f.k}" type="${type}" value="${esc(v)}" ${f.t==='number'?'step="any" min="0"':''} ${req}>${hint}</label>`;
}
async function recordForm(key,rec,onSaved,preset={}){
  const m=MODULES[key];const init={...preset,...(rec||{})};
  modal(t(rec?'Edit':'Add')+': '+t(m.title),`<div class="formscroll"><div class="grid2">${m.fields.map(f=>fieldInput(f,init[f.k])).join('')}</div></div>`,t('Save'),async f=>{
    for(const fl of m.fields){
      if(fl.t==='number'&&f[fl.k]!=='') f[fl.k]=+f[fl.k];
      if(fl.t==='file'){const inp=$(`[data-file="${fl.k}"]`);if(inp&&inp.files[0]){if(inp.files[0].size>15e6) return 'Files must be under 15 MB.';f[fl.k]=await Store.upload(inp.files[0]);}else f[fl.k]=init[fl.k]||null;}
      if(fl.k==='link'&&f.link&&!safeUrl(f.link)) return 'The link must start with http:// or https://';
    }
    if(key==='permits'&&f.to<f.from) return 'Valid to must be after valid from.';
    if(key==='patrol'&&f.obs==='All clear'&&!rec) f.status='Closed';
    const saved=rec?await Store.update(key,rec.id,f):await Store.create(key,f);
    toast(rec?'Saved':'Added');onSaved&&onSaved(saved);
  },{wide:1});
  $$('[data-gps]').forEach(b=>b.onclick=()=>{if(!navigator.geolocation) return toast('Location is not available on this device',1);b.disabled=true;
    navigator.geolocation.getCurrentPosition(p=>{$('#'+b.dataset.gps).value=p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5);b.disabled=false;},()=>{toast('Could not get your location',1);b.disabled=false;},{enableHighAccuracy:true,timeout:15000});});
}

  $('#dlgbody').innerHTML=`<div class="form"><h2>${esc(t(m.title))}</h2>${st?pill(st[0],st[1]):''}<dl class="dl-grid">${rows}<dt>Added by</dt><dd>${esc(r._byName||'—')}, ${fmtDT(r._at)}</dd>${r._upd?`<dt>Last changed</dt><dd>${fmtDT(r._upd)}</dd>`:''}</dl>

  const dlg=$('#dlg');dlg.classList.add('wide');dlg.showModal();

}

function routeStrip(){
  const main=['jamnagar','samakhiali','aburoad','nasirabad','jaipur','mansarampura','gurgaon','piyala','mkhadar','loni'];
  const x0=90,x1=1000,y=66,step=(x1-x0)/(main.length-1);const pos={};main.forEach((id,i)=>pos[id]={x:x0+i*step,y});
  const br={vadinar:{x:pos.jamnagar.x-60,y:142,to:'jamnagar'},kandla:{x:pos.samakhiali.x,y:142,to:'samakhiali'},ajmer:{x:pos.nasirabad.x,y:142,to:'nasirabad'}};
  const dark=isDark();const pipe=dark?'#2A4A86':'#C9D6EE';
  let s=`<svg class="strip" viewBox="0 0 1090 200" role="img" aria-label="Schematic of the Jamnagar–Loni LPG pipeline">`;
  s+=`<text x="${x1}" y="${y+34}" class="sub" text-anchor="end">1,426.6 km incl. spurs</text>`;
  s+=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${pipe}" stroke-width="14" stroke-linecap="round"/>`;
  s+=`<line class="flow" x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="#F5B800" stroke-width="5" stroke-linecap="round"/>`;
  for(const b of Object.values(br)){const t=pos[b.to];const d=`M${b.x} ${b.y} L${b.x} ${y+34} Q${b.x} ${y} ${t.x} ${y}`;

  const node=(id,x,yy,below)=>{const st=station(id),ty=DATA.types[st.type];

  main.forEach(id=>s+=node(id,pos[id].x,y,false));for(const [id,b] of Object.entries(br)) s+=node(id,b.x,b.y,true);
  return s+'</svg>';
}

const HOME={evs:[],calMonth:null,calSel:null};
function renderCal(){
  const t0=today();if(!HOME.calMonth) HOME.calMonth=new Date(t0.getFullYear(),t0.getMonth(),1);
  const y=HOME.calMonth.getFullYear(),m=HOME.calMonth.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),has=new Set(HOME.evs.map(e=>e.date));
  let cells=(LANG==='hi'?['र','सो','मं','बु','गु','शु','श']:['S','M','T','W','T','F','S']).map(d=>`<div class="dn">${d}</div>`).join('')+'<div></div>'.repeat(first);
  for(let d=1;d<=n;d++){const ds=iso(new Date(y,m,d));cells+=`<button class="${ds===iso(t0)?'today':''} ${has.has(ds)?'has':''} ${ds===HOME.calSel?'sel':''}" data-d="${ds}" aria-label="${d} ${monthName(m)}${has.has(ds)?', has events':''}">${d}</button>`;}
  $('#cal').innerHTML=`<div class="cal-h"><button id="cp" aria-label="Previous month">${ic('left',16)}</button><b>${monthName(m)} ${y}</b><button id="cn" aria-label="Next month">${ic('right',16)}</button></div><div class="cal-g">${cells}</div>`;
  $('#cp').onclick=()=>{HOME.calMonth=new Date(y,m-1,1);renderCal();};$('#cn').onclick=()=>{HOME.calMonth=new Date(y,m+1,1);renderCal();};
  $$('#cal [data-d]').forEach(b=>b.onclick=()=>{HOME.calSel=HOME.calSel===b.dataset.d?null:b.dataset.d;renderCal();renderEvents();});
}
function renderEvents(){
  let evs=HOME.evs.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));if(HOME.calSel) evs=evs.filter(e=>e.date===HOME.calSel);
  const tc={HR:'HR','F&S':'FS','O&M':'OM'};
  $('#evlist').innerHTML=(HOME.calSel?`<div style="padding:8px 20px;font-size:13px;border-top:1px solid var(--line)" class="muted">Showing ${fmtDate(HOME.calSel)} <button class="linkbtn" id="clrsel">Show all</button></div>`:'')+

     <div><h4 class="hi">${esc(e.title)}</h4><p class="hi">${esc(e.sub||'')}</p><div class="meta">${ic('clock',14)}${esc(e.time||'')} ${e.place?`${ic('pin',14)}${esc(e.place)}`:''}<span class="tag ${tc[e.tag]||''}">${esc(e.tag||'')}</span>
     ${Store.can('events','d',e)?`<button class="linkbtn" style="margin-left:auto;font-weight:400;font-size:12.5px" data-del="${e.id}">${t('Delete')}</button>`:''}</div></div></article>`;}).join('')
    :`<p class="muted" style="padding:16px 20px;margin:0;border-top:1px solid var(--line)">No events ${HOME.calSel?'on this day':'yet'}.</p>`);
  const c=$('#clrsel');if(c)c.onclick=()=>{HOME.calSel=null;renderCal();renderEvents();};
  $$('#evlist [data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this event?')) return;try{await Store.remove('events',+b.dataset.del);HOME.evs=HOME.evs.filter(x=>String(x.id)!==b.dataset.del);renderCal();renderEvents();toast('Event deleted');}catch(e){toast(e.message,1);}});

function tickClock(){const c=$('#clk');if(!c) return;const d=new Date();c.textContent=d.toLocaleTimeString('en-GB');$('#clkd').textContent=`${LANG==='hi'?DAYS_HI[d.getDay()]:DAYS[d.getDay()]}, ${d.getDate()} ${monthName(d.getMonth())} ${d.getFullYear()}`;}
function countUp(){$$('[data-count]').forEach(el=>{const to=+el.dataset.count,dec=+(el.dataset.dec||0);if(reduced()){el.textContent=fmt(to,dec);return;}const t0=performance.now();
  const step=tm=>{const p=Math.min(1,(tm-t0)/1300),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e,dec);if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);});}

    a.onmouseleave=a.onblur=()=>tip.style.display='none';});};
  bindTips();$$('#layers .chip').forEach(c=>c.onclick=()=>{c.setAttribute('aria-pressed',c.getAttribute('aria-pressed')!=='true');layers=$$('#layers .chip').filter(x=>x.getAttribute('aria-pressed')==='true').map(x=>x.dataset.l);$('#mapwrap').innerHTML=mapSVG(layers);bindTips();});

  $('#util').innerHTML=`<div class="wrap"><div class="ticker" aria-label="Notices">${notices.length?`<div class="ticker-track">${[...notices,...notices].map(n=>`<span>${esc(n)}</span>`).join('')}</div>`:''}</div>
    <span class="emerg">LPG emergency: 1906</span><div class="util-actions">
    <span class="fsz" role="group" aria-label="${t('Text size')}">${[[0.9,'A−'],[1,'A'],[1.15,'A+']].map(([z,l])=>`<button data-z="${z}" aria-pressed="${fz===z}" aria-label="${t('Text size')} ${l}">${l}</button>`).join('')}</span>
    <button id="langBtn" aria-label="Language">${ic('lang',14)}${LANG==='hi'?'English':'हिंदी'}</button><button id="themeBtn" aria-label="Switch colour theme">${ic(isDark()?'sun':'moon',14)}${t(isDark()?'Light':'Dark')}</button></div></div>`;
  const nav=u?NAV():[];
  $('#hdr').innerHTML=`<div class="wrap"><a class="brand" href="#/home" aria-label="JLPL O&M home"><div class="mark" title="Replace with the official GAIL logo"><span>JLPL</span></div><div><b>JLPL (O&amp;M)</b><small>GAIL (India) Limited</small></div></a>
    <nav class="main" id="nav" aria-label="Main">${nav.map((n,i)=>n.items?`<div class="ddwrap"><button data-dd="${i}" aria-expanded="false" aria-haspopup="true" data-r="${n.r}">${t(n.label)} <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="mega ${n.items.length<7?'sm':''}" data-mega="${i}">${n.items.map(([l,h,icn,d])=>`<a href="${h}"><span class="mi">${ic(icn,18)}</span><span><b>${esc(t(l))}</b><small>${esc(d||'')}</small></span></a>`).join('')}</div></div>`:`<a href="${n.href}" data-r="${n.r}">${t(n.label)}</a>`).join('')}</nav>
    <div class="hdr-actions">${u?`<button class="kbtn" id="cmdBtn" aria-label="${t('Search portal')}">${ic('search',16)}<span class="kl">${t('Search portal')}</span><kbd>Ctrl K</kbd></button>
      <div style="position:relative"><button class="userbtn" id="ubtn" aria-expanded="false" aria-haspopup="true"><span class="avatar">${esc(initials(u.name))}</span><span class="kl" style="text-align:left">${esc(u.name.split(' ')[0])}<small>${esc(ROLES[u.role]?.split(' ')[0]||u.role)}</small></span></button>
        <div class="usermenu" id="umenu"><div class="who"><b>${esc(u.name)}</b><div class="muted" style="font-size:12.5px">${esc(u.username)}${u.station?', '+esc(stName(u.station)):''}</div><span class="rolepill">${esc(ROLES[u.role]||u.role)}</span></div>
        ${Store.mode==='api'&&Store.authMode==='local'?`<button id="chpw">${ic('key',16)}${t('Change password')}</button>`:''}${u.role==='admin'?`<a href="#/admin">${ic('settings',16)}${t('Admin')}</a>`:''}<a href="#/help">${ic('book',16)}${t('Help')}</a>
        ${Store.authMode==='header'&&Store.mode==='api'?'':`<button id="sout">${ic('logout',16)}${t('Sign out')}</button>`}</div></div>
      <button class="burger" id="burger" aria-expanded="false" aria-controls="nav" aria-label="Menu">${ic('menu')}</button>`:''}</div></div>`;
  $('#demobar').hidden=Store.mode==='api';
  $('#foot').innerHTML=`<div class="wrap"><div><div class="brand" style="color:#fff"><div class="mark"><span>JLPL</span></div><div><b style="color:#fff">JLPL (O&amp;M)</b><small style="color:#9FB4DB">GAIL (India) Limited</small></div></div>
    <p style="max-width:40ch;margin-top:14px">Operations and maintenance portal for the Jamnagar–Loni LPG Pipeline. Content owned and maintained by JLPL O&amp;M, GAIL (India) Limited.</p></div>
    <div><h4>${t('Operations')}</h4><a href="#/bases">${t('Maintenance bases')}</a><a href="#/m/shiftlog">${t('Shift logbook')}</a><a href="#/m/patrol">${t('ROU patrolling')}</a><a href="#/m/permits">${t('Work permits')}</a></div>
    <div><h4>${t('Help')}</h4><a href="#/sitemap">${t('Sitemap')}</a><a href="#/accessibility">${t('Accessibility')}</a><a href="#/help">${t('Help')}</a><a href="#/m/directory">${t('Telephone directory')}</a></div>
    <div><h4>Emergency</h4><div class="sos"><div><span>LPG emergency</span><b>1906</b></div><div><span>Fire</span><b>101</b></div><div><span>Ambulance</span><b>108</b></div><div><span>Police</span><b>112</b></div></div></div></div>
    <div class="foot-b">© ${new Date().getFullYear()} GAIL (India) Limited | JLPL Operations &amp; Maintenance. ${t('Last updated')}: ${fmtDate(LAST_UPDATED)}. Version ${APP_VERSION}.</div>`;
  bindChrome();
}
function bindChrome(){
  $$('.fsz [data-z]').forEach(b=>b.onclick=()=>{lsSet('jlpl.zoom',+b.dataset.z);buildChrome();});
  $('#langBtn').onclick=()=>{LANG=LANG==='hi'?'en':'hi';lsSet('jlpl.lang',LANG);buildChrome();router(true);};
  $('#themeBtn').onclick=()=>{const th=isDark()?'light':'dark';lsSet('jlpl.theme',th);document.documentElement.dataset.theme=th;buildChrome();router(true);};
  if(!Store.user) return;
  $$('[data-dd]').forEach(b=>b.onclick=e=>{e.stopPropagation();const m=$(`[data-mega="${b.dataset.dd}"]`),o=!m.classList.contains('open');closeMenus();m.classList.toggle('open',o);b.setAttribute('aria-expanded',o);});
  $('#burger').onclick=()=>{const n=$('#nav'),o=!n.classList.contains('open');n.classList.toggle('open',o);$('#burger').setAttribute('aria-expanded',o);};
  $('#cmdBtn').onclick=openCmd;
  $('#ubtn').onclick=e=>{e.stopPropagation();const m=$('#umenu'),o=!m.classList.contains('open');closeMenus();m.classList.toggle('open',o);$('#ubtn').setAttribute('aria-expanded',o);};
  const so=$('#sout');if(so) so.onclick=signOut;
  const cp=$('#chpw');if(cp) cp.onclick=()=>modal(t('Change password'),`<label>Current password<input type="password" name="old" required autocomplete="current-password"></label><label>New password<input type="password" name="new" required minlength="10" autocomplete="new-password"></label><label>Repeat new password<input type="password" name="new2" required autocomplete="new-password"></label>`,t('Save'),async f=>{
    if(f.new!==f.new2) return 'The new passwords do not match.';await Store.req('POST','api/password',{old:f.old,new:f.new});toast('Password changed');});
}
function closeMenus(){$$('.mega.open,.usermenu.open').forEach(m=>m.classList.remove('open'));$$('[aria-expanded="true"]').forEach(b=>{if(b.id!=='burger') b.setAttribute('aria-expanded','false');});}
document.addEventListener('click',e=>{if(!e.target.closest('.ddwrap,#ubtn,#umenu')) closeMenus();});

/* ----- command palette ----- */
function cmdItems(q){q=q.toLowerCase().trim();
  const all=[...NAV().flatMap(n=>n.items?n.items.map(i=>({n:t(i[0]),h:i[1],i:i[2],k:t(n.label)})):[{n:t(n.label),h:n.href,i:'arrow',k:'Page'}]),
    ...DATA.stations.map(s=>({n:s.name,h:'#/bases/'+s.id,i:'pin',k:DATA.types[s.type].label}))];
  return (q?all.filter(x=>(x.n+' '+x.k).toLowerCase().includes(q)):all.slice(0,12)).slice(0,14);}
let cmdSel=0;
function renderCmd(){const it=cmdItems($('#cmdq').value);cmdSel=Math.min(cmdSel,Math.max(0,it.length-1));
  $('#cmdres').innerHTML=it.length?it.map((x,i)=>`<a href="${x.h}" class="${i===cmdSel?'on':''}" role="option" aria-selected="${i===cmdSel}">${ic(x.i,18)}<span>${esc(x.n)}</span><small>${esc(x.k)}</small></a>`).join(''):'<p class="muted" style="padding:14px">Nothing matches.</p>';
  $$('#cmdres a').forEach(a=>a.onclick=()=>$('#cmd').close());}
function openCmd(){if(!Store.user) return;$('#cmdq').value='';cmdSel=0;renderCmd();$('#cmd').showModal();$('#cmdq').focus();}

/* ----- modal ----- */
function modal(title,fields,label,onSubmit,o={}){
  const dlg=$('#dlg');dlg.classList.toggle('wide',!!o.wide);
  $('#dlgbody').innerHTML=`<form class="form" novalidate><h2>${esc(title)}</h2>${fields}<div class="err" id="ferr" role="alert"></div><div class="actions"><button type="button" class="btn ghost" id="fcancel">${t('Cancel')}</button><button class="btn" type="submit" id="fsub">${esc(label)}</button></div></form>`;
  const form=dlg.querySelector('form');$('#fcancel').onclick=()=>dlg.close();
  form.onsubmit=async e=>{e.preventDefault();
    if(!form.checkValidity()){const bad=form.querySelector(':invalid');$('#ferr').textContent=(bad.closest('label')?.firstChild?.textContent||'A field').trim().replace(/\s*\*$/,'')+' needs a valid value.';bad.focus();return;}
    const f=Object.fromEntries(new FormData(form));Object.keys(f).forEach(k=>{if(typeof f[k]==='string') f[k]=f[k].trim();});
    const b=$('#fsub');b.disabled=true;b.textContent='Saving…';
    try{const err=await onSubmit(f);if(err){$('#ferr').textContent=err;b.disabled=false;b.textContent=label;return;}dlg.close();}
    catch(er){$('#ferr').textContent=er.message;b.disabled=false;b.textContent=label;}};
  dlg.showModal();form.querySelector('input:not([readonly]),select,textarea')?.focus();
}

/* ----- router ----- */
const ROUTES={
  login:{v:pageLogin,a:afterLogin,open:1},home:{v:pageHome,a:afterHome},organogram:{v:pageOrg,a:afterOrg},dept:{v:pageDept},bases:{v:pageBases,a:afterBases},
  contracts:{v:pageContracts,a:afterContracts},vehicles:{v:pageVehicles,a:afterVehicles},training:{v:pageTraining,a:afterTraining},
  instrumentation:{v:pageInstr,a:()=>mountModule($('#calroot'),'calibration')},admin:{v:pageAdmin,a:afterAdmin},
  sitemap:{v:pageSitemap},schematic:{v:pageSchematic,a:startMimicClock},accessibility:{v:pageAccess},help:{v:pageHelp},
  m:{v:k=>MODULES[k]&&MODULES[k].cols.length?(Store.can(k,'r')?pageModule(k):banner(esc(t(MODULES[k].title)),'',MODULES[k].icon,'')+noAccess()):page404(),a:k=>MODULES[k]&&Store.can(k,'r')&&mountModule($('#modroot'),k)}
};
let routeSeq=0,lastHash='';
async function router(keep){
  const h=location.hash||'#/home';
  if(h.length>1&&!h.startsWith('#/')){const el=document.getElementById(h.slice(1));if(el){el.scrollIntoView({behavior:reduced()?'auto':'smooth'});return;}}
  let [r,arg]=h.replace(/^#\/?/,'').split('/');r=r||'home';
  if(!Store.user&&r!=='login'){sessionStorage.setItem('jlpl.next',h);location.replace('#/login');return;}
  if(Store.user&&r==='login'){location.replace(sessionStorage.getItem('jlpl.next')||'#/home');sessionStorage.removeItem('jlpl.next');return;}
  if(h!==lastHash&&!keep&&r!=='bases') stTab=null;
  if(r==='bases'&&lastHash.split('/')[2]!==arg&&!keep) stTab=null;
  const seq=++routeSeq;timers.forEach(clearInterval);timers=[];closeMenus();$('#nav')?.classList.remove('open');
  const def=ROUTES[r];const app=$('#app');
  try{
    const html=def?await def.v(arg):page404();if(seq!==routeSeq) return;
    app.innerHTML=html;if(def&&def.a) await def.a(arg);
  }catch(e){console.error(e);if(seq===routeSeq) app.innerHTML=banner('Something went wrong',esc(e.message),'alert')+`<div class="wrap page"><button class="btn" onclick="location.reload()">Reload</button></div>`;}
  const grp=r==='m'?ROUTE_GROUP[arg]||arg:ROUTE_GROUP[r]||r;
  $$('nav.main [data-r]').forEach(a=>a.classList.toggle('active',a.dataset.r===grp||(r==='m'&&a.dataset.r===arg)));
  const titles={schematic:'Pipeline mimic',home:'Home',organogram:'Organogram',bases:'Maintenance bases',contracts:'Contractor management',vehicles:'Vehicle sharing',training:'F&S training',instrumentation:'Instrumentation',admin:'Admin',sitemap:'Sitemap',accessibility:'Accessibility',help:'Help',login:'Sign in'};
  document.title=(r==='m'&&MODULES[arg]?t(MODULES[arg].title):t(titles[r]||'JLPL'))+' | JLPL (O&M) | GAIL';
  if(h!==lastHash&&!keep){window.scrollTo(0,0);const m=$('#app');m.setAttribute('tabindex','-1');}lastHash=h;
}

/* ----- start ----- */
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd();}
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$('dialog[open]')){e.preventDefault();openCmd();}});
$('#cmdq').oninput=()=>{cmdSel=0;renderCmd();};$('#cmdx').onclick=()=>$('#cmd').close();
$('#cmdq').onkeydown=e=>{const n=$$('#cmdres a').length;if(!n) return;if(e.key==='ArrowDown'){e.preventDefault();cmdSel=(cmdSel+1)%n;renderCmd();}else if(e.key==='ArrowUp'){e.preventDefault();cmdSel=(cmdSel-1+n)%n;renderCmd();}else if(e.key==='Enter'){const a=$$('#cmdres a')[cmdSel];if(a){location.hash=a.getAttribute('href');$('#cmd').close();}}};
window.addEventListener('online',()=>{document.body.classList.remove('offline');outboxFlush();});window.addEventListener('offline',()=>document.body.classList.add('offline'));
(async()=>{
  const th=lsGet('jlpl.theme',null);if(th) document.documentElement.dataset.theme=th;
  if(!navigator.onLine) document.body.classList.add('offline');
  await Store.init();buildChrome();window.addEventListener('hashchange',()=>router());await router();outboxFlush();
  if(Store.mode==='api'&&'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
